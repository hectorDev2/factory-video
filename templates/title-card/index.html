<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow","default":"Nuevo lanzamiento","maxLength":32},
    {"id":"headline","type":"string","label":"Titular","default":"Videos en serie, sin editar a mano","maxLength":48},
    {"id":"subline","type":"string","label":"Subtítulo","default":"Una plantilla, cientos de variantes.","maxLength":72},
    {"id":"cta","type":"string","label":"Llamada a la acción","default":"factory.video","maxLength":32},
    {"id":"accent","type":"color","label":"Color de acento","default":"#ff5a36"},
    {"id":"ground","type":"color","label":"Fondo","default":"#0d0d12"},
    {"id":"ink","type":"color","label":"Texto","default":"#f4f1ea"},
    {"id":"music","type":"string","label":"Música (lo rellena la factory)","default":"assets/music/silence.m4a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #ff5a36;
        --ground: #0d0d12;
        --ink: #f4f1ea;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Inter", sans-serif;
        color: var(--ink);
        background: var(--ground);
      }
      #card {
        position: absolute;
        inset: 0;
        padding: 0 220px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #bar {
        width: 160px;
        height: 14px;
        background: var(--accent);
        transform-origin: left center;
        margin-bottom: 48px;
      }
      #eyebrow {
        font-family: "Space Mono", monospace;
        font-size: 34px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 28px;
      }
      #headline {
        font-size: 124px;
        font-weight: 900;
        line-height: 1.02;
        letter-spacing: -0.035em;
        max-width: 1400px;
      }
      #subline {
        font-size: 46px;
        font-weight: 400;
        line-height: 1.3;
        margin-top: 40px;
        opacity: 0.72;
        max-width: 1200px;
      }
      #cta {
        position: absolute;
        right: 220px;
        bottom: 140px;
        font-family: "Space Mono", monospace;
        font-size: 36px;
        padding: 18px 34px;
        border: 3px solid var(--accent);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <audio id="music" class="clip" data-start="0" data-duration="6" data-track-index="5" data-volume="1" data-var-src="music" src="assets/music/silence.m4a"></audio>
      <div id="card">
        <div id="bar" class="clip" data-start="0" data-duration="6" data-track-kind="graphics" data-track-index="0"></div>
        <p id="eyebrow" class="clip" data-start="0" data-duration="6" data-track-kind="graphics" data-track-index="1" data-var-text="eyebrow">Nuevo lanzamiento</p>
        <h1 id="headline" class="clip" data-start="0" data-duration="6" data-track-kind="graphics" data-track-index="2" data-var-text="headline">Videos en serie, sin editar a mano</h1>
        <p id="subline" class="clip" data-start="0" data-duration="6" data-track-kind="graphics" data-track-index="3" data-var-text="subline">Una plantilla, cientos de variantes.</p>
        <div id="cta" class="clip" data-start="0" data-duration="6" data-track-kind="graphics" data-track-index="4" data-var-text="cta">factory.video</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Entrada (0 – 1.4 s)
      tl.fromTo("#bar", { scaleX: 0.25 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 0)
        .fromTo("#eyebrow", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3)
        .fromTo("#headline", { scale: 1.06, transformOrigin: "left center" }, { scale: 1, duration: 1.2, ease: "power4.out" }, 0)
        .fromTo("#subline", { y: 30, opacity: 0 }, { y: 0, opacity: 0.72, duration: 0.6, ease: "power3.out" }, 0.8)
        .fromTo("#cta", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.4);

      // Respiración lenta durante el hold
      tl.to("#headline", { scale: 1.015, transformOrigin: "left center", duration: 3.6, ease: "none" }, 1.4);

      // Salida (5.2 – 5.9 s)
      tl.to(["#eyebrow", "#headline", "#subline", "#cta"], { y: -30, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.05 }, 5.2)
        .to("#bar", { scaleX: 0, transformOrigin: "right center", duration: 0.4, ease: "expo.in" }, 5.45);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
